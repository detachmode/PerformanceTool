name: Docker

# Builds the host image (Dockerfile) for linux/amd64 and linux/arm64 and pushes it to the GitHub Container Registry
# (ghcr.io/<owner>/beesharp), like Paperoni. Logs in with the workflow's GITHUB_TOKEN: no secrets to set up.
# Linux images also run on Windows and macOS via Docker Desktop; native Windows containers are not built.
# Pushes on main (tags: latest, sha-<short>) and on version tags v* (tags: 1.2.3, 1.2). PRs only build and test, no push.
#
# Each platform builds in parallel on its own native runner (no emulation), then starts the image and runs the
# end-to-end smoke test (tests/e2e) against it. Only a tested image is pushed (by digest); the merge job then joins
# the per-platform digests into one multi-arch tag.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/beesharp
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Platform name
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      # Build for this runner's own platform and load it into the local Docker for the test.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: beesharp:e2e
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

      - name: Start container
        run: |
          docker run -d --name beesharp -p 8080:8080 beesharp:e2e
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/api/scenarios && exit 0
            sleep 1
          done
          echo "The container did not answer on :8080 within 60 s" >&2
          docker logs beesharp
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: End-to-end smoke test
        working-directory: tests/e2e
        env:
          BASE_URL: http://localhost:8080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run smoke

      - name: Container logs
        if: always()
        run: docker logs beesharp || true

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the Build step, so this comes from the cache. Pushed by digest only; the merge job adds the tags.
      - name: Push by digest
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the tested per-platform images into one multi-arch tag set.
  merge:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
