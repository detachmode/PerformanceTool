name: Docker

# Builds the host image (Dockerfile) for linux/amd64 and linux/arm64 and pushes it to the GitHub Container Registry
# (ghcr.io/<owner>/beesharp), like Paperoni. Logs in with the workflow's GITHUB_TOKEN: no secrets to set up.
# Linux images also run on Windows and macOS via Docker Desktop; native Windows containers are not built.
# Pushes on main (tags: latest, sha-<short>) and on version tags v* (tags: 1.2.3, 1.2). PRs only build and test, no push.
#
# One job builds both platforms and pushes them under the final tags; the SDK stage cross-publishes on the runner's own
# platform, so arm64 needs no emulation and buildx builds both platforms side by side. Afterwards the e2e job starts the
# pushed image on each platform's native runner and runs the end-to-end smoke test (tests/e2e). It does not block the
# push: a failing smoke test marks the run red, the image is out. On PRs nothing is pushed: e2e builds the image from the cache.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/beesharp
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # QEMU only as a fallback: the Dockerfile cross-publishes on the build platform and has no RUN in the runtime stage.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # End-to-end smoke test of the image, on each platform's native runner. Runs after the push and never holds it back.
  e2e:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed: test exactly the published image (the sha-<short> tag, this runner's architecture).
      - name: Pull image
        if: env.PUSH == 'true'
        run: |
          docker pull --platform "${{ matrix.platform }}" "$IMAGE:sha-${GITHUB_SHA::7}"
          docker tag "$IMAGE:sha-${GITHUB_SHA::7}" beesharp:e2e

      - uses: docker/setup-buildx-action@v3
        if: env.PUSH != 'true'

      # PR: nothing was pushed, so build this platform's image from the image job's cache.
      - name: Build image
        if: env.PUSH != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: beesharp:e2e
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha

      - name: Start container
        run: |
          docker run -d --name beesharp -p 8080:8080 beesharp:e2e
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/api/scenarios && exit 0
            sleep 1
          done
          echo "The container did not answer on :8080 within 60 s" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: End-to-end smoke test
        working-directory: tests/e2e
        env:
          BASE_URL: http://localhost:8080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run smoke

      - name: Container logs
        if: always()
        run: docker logs beesharp || true
