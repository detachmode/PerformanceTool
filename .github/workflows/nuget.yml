name: NuGet

# Packs and publishes Beesharp.Host (and its Beesharp.* library dependencies) to NuGet.org
# on version tags (v*) or manual dispatch.
# Supports either NuGet Trusted Publishing (OIDC: set repository variable NUGET_USER)
# or a classic API key (set repository secret NUGET_API_KEY).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (leave empty to use Beesharp.Core.csproj, e.g. 0.1.0)'
        required: false
        type: string
      dry_run:
        description: 'Pack and upload artifact only without pushing to NuGet.org'
        required: false
        default: false
        type: boolean

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Beesharp.Core/Beesharp.Core.csproj | head -n 1)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved package version: $VERSION"

      - name: Test Core, Scripting and Host
        run: |
          dotnet test tests/Beesharp.Core.Tests/Beesharp.Core.Tests.csproj -c Release
          dotnet test tests/Beesharp.Scripting.Tests/Beesharp.Scripting.Tests.csproj -c Release
          dotnet test tests/Beesharp.Tests/Beesharp.Tests.csproj -c Release

      - name: Publish Beesharp.Client UI
        run: >
          dotnet publish src/Beesharp.Client/Beesharp.Client.csproj
          -c Release
          -o artifacts/client-ui
          -p:BuildSha=${{ github.sha }}

      - name: Pack Beesharp packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          for proj in \
            src/Beesharp.Core/Beesharp.Core.csproj \
            src/Beesharp.Contracts/Beesharp.Contracts.csproj \
            src/Beesharp.Ai.Contracts/Beesharp.Ai.Contracts.csproj \
            src/Beesharp.Storage/Beesharp.Storage.csproj \
            src/Beesharp.Storage.DuckDb/Beesharp.Storage.DuckDb.csproj \
            src/Beesharp.Scripting/Beesharp.Scripting.csproj \
            src/Beesharp.Engine/Beesharp.Engine.csproj \
            src/Beesharp.Ai/Beesharp.Ai.csproj; do
            dotnet pack "$proj" \
              -c Release \
              -o artifacts/nuget \
              -p:Version="$VERSION" \
              -p:ContinuousIntegrationBuild=true
          done
          dotnet pack src/Beesharp.Host/Beesharp.Host.csproj \
            -c Release \
            -o artifacts/nuget \
            -p:Version="$VERSION" \
            -p:BuildSha="${{ github.sha }}" \
            -p:BeesharpClientWwwroot="$(pwd)/artifacts/client-ui/wwwroot" \
            -p:ContinuousIntegrationBuild=true
          ls -lh artifacts/nuget/*.nupkg

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beesharp-nuget-${{ steps.ver.outputs.version }}
          path: artifacts/nuget/*.nupkg

      # Option 1 (recommended): NuGet Trusted Publishing via OIDC (no long-lived API key secret).
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        if: inputs.dry_run != true && vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        if: inputs.dry_run != true
        env:
          SECRET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          OIDC_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          API_KEY="${SECRET_API_KEY:-$OIDC_API_KEY}"
          if [ -z "$API_KEY" ]; then
            echo "::error::Neither secrets.NUGET_API_KEY nor vars.NUGET_USER (NuGet Trusted Publishing) is configured."
            exit 1
          fi
          VERSION="${{ steps.ver.outputs.version }}"
          for pkg in \
            Beesharp.Core \
            Beesharp.Contracts \
            Beesharp.Ai.Contracts \
            Beesharp.Storage \
            Beesharp.Storage.DuckDb \
            Beesharp.Scripting \
            Beesharp.Engine \
            Beesharp.Ai \
            Beesharp.Host; do
            dotnet nuget push "artifacts/nuget/${pkg}.${VERSION}.nupkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$API_KEY" \
              --skip-duplicate
          done

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Beesharp NuGet"
            echo "- **Version:** \`${{ steps.ver.outputs.version }}\`"
            echo "- **Dry run:** \`${{ inputs.dry_run == true }}\`"
            echo "- **Packages:** \`Beesharp.Core\`, \`Beesharp.Contracts\`, \`Beesharp.Ai.Contracts\`, \`Beesharp.Storage\`, \`Beesharp.Storage.DuckDb\`, \`Beesharp.Scripting\`, \`Beesharp.Engine\`, \`Beesharp.Ai\`, \`Beesharp.Host\`"
          } >> "$GITHUB_STEP_SUMMARY"
