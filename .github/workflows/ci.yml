name: CI/CD

# Unified, ordered pipeline:
#   gate ─► build-test ─┬─► docker-build ─► e2e (amd64, arm64) ─┬─► docker-push (main, v*)
#                       │                                       └─► nuget-publish (v*)
#                       └─► pages-build ─► pages-deploy (main, or v* tag at main tip)
#
# Pull requests run build-test -> docker-build -> e2e (no deploys or pushes).
# Pushes to main only deploy Pages after build-test passes, and only push Docker images after e2e passes.
# Version tags (v*) only push Docker images and NuGet packages after build-test and e2e pass.
# When main and a v* tag are pushed together (e.g. git push --follow-tags), gate skips the duplicate main run
# and lets the v* tag run also publish :latest and GitHub Pages.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on PRs, but never cancel in-progress main/release deploys.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  IMAGE: ghcr.io/${{ github.repository_owner }}/beesharp

jobs:
  # 0. Deduplicate simultaneous main + v* tag pushes (e.g. git push --follow-tags):
  #    skip the main run when HEAD already has a v* tag, and let the tag run also publish :latest and Pages.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
      is_main: ${{ steps.check.outputs.is_main }}
    steps:
      - name: Check ref
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          RUN="true"
          IS_MAIN="false"

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            IS_MAIN="true"
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
              TAGS=$(git ls-remote --tags "$REPO_URL" "refs/tags/v*")
              if printf '%s\n' "$TAGS" | awk -v sha="$GITHUB_SHA" '$1 == sha { found = 1; exit } END { exit !found }'; then
                echo "Commit $GITHUB_SHA has a v* tag; skipping duplicate main run."
                RUN="false"
              fi
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            MAIN_SHA=$(git ls-remote "$REPO_URL" "refs/heads/main" | awk '{ print $1 }')
            if [[ "$MAIN_SHA" == "$GITHUB_SHA" ]]; then
              IS_MAIN="true"
            fi
          fi

          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "is_main=$IS_MAIN" >> "$GITHUB_OUTPUT"

  # 1. Restore, build, and run all unit & integration tests.
  build-test:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The projects target net11.0. Asking for the "11.0.x" channel with quality "preview"
      # installs the newest 11.0 build whether it is still a preview/RC or already GA, so this
      # keeps working across the prerelease -> release transition.
      - name: Set up .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # No packages.lock.json in the repo, so cache the NuGet folder keyed by project files.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Beesharp.slnx

      - name: Build
        run: dotnet build Beesharp.slnx --no-restore -c Release

      # One TRX file per test project (tests/Beesharp.*.Tests), all in TestResults/.
      - name: Test
        run: >
          dotnet test Beesharp.slnx --no-build -c Release
          --logger "trx;LogFilePrefix=results"
          --results-directory TestResults

      - name: Test summary
        if: always()
        run: .github/scripts/test-summary.sh TestResults >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn

  # 2a. Build the multi-arch Docker image into the GHA build cache (no push yet — e2e gates the push).
  docker-build:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # QEMU only as a fallback: the Dockerfile cross-publishes on the build platform and has no RUN in the runtime stage.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. End-to-end Playwright smoke test of the Docker image on each platform's native runner.
  e2e:
    needs: docker-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Load this platform's image from the GHA cache populated by docker-build.
      - name: Load image from cache
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: beesharp:e2e
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha

      - name: Start container
        run: |
          docker run -d --name beesharp -p 8080:8080 beesharp:e2e
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/api/scenarios && exit 0
            sleep 1
          done
          echo "The container did not answer on :8080 within 60 s" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: End-to-end smoke test
        working-directory: tests/e2e
        env:
          BASE_URL: http://localhost:8080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run smoke

      - name: Container logs
        if: always()
        run: docker logs beesharp || true

  # 4a. Push the verified multi-arch Docker image to GHCR (main and version tags only).
  docker-push:
    needs: [gate, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ needs.gate.outputs.is_main == 'true' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha

  # 4b. Publish Beesharp.Core & Beesharp.Host to NuGet.org on version tags (v*), only after build-test + e2e pass.
  nuget-publish:
    needs: e2e
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/nuget.yml
    secrets: inherit

  # 2b. Build the GitHub Pages fake-data demo site (brain 0015), only on main (or a v* tag at main tip) after build-test passes.
  pages-build:
    needs: [gate, build-test]
    if: needs.gate.outputs.is_main == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # Release publish = trimmed. Beesharp.Core is a TrimmerRootAssembly so the generated editor keeps its metadata.
      # BuildSha / BuildTime end up in the UI's build info (brain 0025).
      - name: Publish client
        run: |
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"
          dotnet publish src/Beesharp.Client -c Release -o out \
            -p:BuildSha="${{ github.sha }}" -p:BuildTime="$BUILD_TIME"

      - name: Prepare site
        working-directory: out/wwwroot
        run: |
          # Pre-compressed copies are not used by GitHub Pages.
          find . -name '*.br' -delete -o -name '*.gz' -delete
          # The site lives under /PerformanceTool/.
          sed -i 's|<base href="/" />|<base href="/PerformanceTool/" />|' index.html
          grep -q '<base href="/PerformanceTool/" />' index.html
          # Cache-bust the files the fingerprint placeholders do not cover (framework and JS modules are content-hashed by the build).
          sed -i 's|href="app.css"|href="app.css?v=${{ github.sha }}"|; s|href="favicon.svg"|href="favicon.svg?v=${{ github.sha }}"|' index.html
          grep -q 'app.css?v=' index.html
          # SPA deep links (/editor) hit Pages' 404 page, which is the app itself.
          cp index.html 404.html
          # Lets a running page notice a newer deploy (brain 0025). Fetched with cache: no-store.
          printf '{"sha":"%s","time":"%s"}\n' "${{ github.sha }}" "$BUILD_TIME" > build-info.json
          # Do not run Jekyll (it would drop the _framework folder).
          touch .nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  # 3b. Deploy the Pages artifact in a separate job so the uploaded artifact is always visible to the API.
  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
