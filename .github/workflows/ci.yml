name: CI

# Runs on pushes to main and as PR build validation only (user decision), plus manual runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The projects target net11.0. Asking for the "11.0.x" channel with quality "preview"
      # installs the newest 11.0 build whether it is still a preview/RC or already GA, so this
      # keeps working across the prerelease -> release transition.
      - name: Set up .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # No packages.lock.json in the repo, so cache the NuGet folder keyed by project files.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Beesharp.slnx

      - name: Build
        run: dotnet build Beesharp.slnx --no-restore -c Release

      # One TRX file per test project (tests/Beesharp.*.Tests), all in TestResults/.
      - name: Test
        run: >
          dotnet test Beesharp.slnx --no-build -c Release
          --logger "trx;LogFilePrefix=results"
          --results-directory TestResults

      - name: Test summary
        if: always()
        run: .github/scripts/test-summary.sh TestResults >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn
