name: Pages

# Publishes the Blazor WebAssembly client with fake data (brain 0015) to https://detachmode.github.io/PerformanceTool/.
# One-time repo setting: Settings > Pages > Source: "GitHub Actions".
# Runs after every merge to main (a merge is a push to main), plus manual runs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

# Two jobs, like GitHub's official Pages template: the deploy job starts only after the build job has finished, so the
# uploaded "github-pages" artifact is visible to the API. In one job, deploy-pages could look for it too early and find
# none ("No artifacts named github-pages were found"), as happened once after PR #11.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Same setup as ci.yml (newest 11.0 build, preview or GA).
      - name: Set up .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # Release publish = trimmed. PerformanceTool.Core is a TrimmerRootAssembly so the generated editor keeps its metadata.
      # No wasm-tools workload needed (no AOT, no native relinking).
      # BuildSha / BuildTime end up in the UI's build info (brain 0025).
      - name: Publish client
        run: |
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"
          dotnet publish src/PerformanceTool.Client -c Release -o out \
            -p:BuildSha="${{ github.sha }}" -p:BuildTime="$BUILD_TIME"

      - name: Prepare site
        working-directory: out/wwwroot
        run: |
          # Pre-compressed copies are not used by GitHub Pages.
          find . -name '*.br' -delete -o -name '*.gz' -delete
          # The site lives under /PerformanceTool/.
          sed -i 's|<base href="/" />|<base href="/PerformanceTool/" />|' index.html
          grep -q '<base href="/PerformanceTool/" />' index.html
          # Cache-bust the files the fingerprint placeholders do not cover (framework and JS modules are content-hashed by the build).
          sed -i 's|href="app.css"|href="app.css?v=${{ github.sha }}"|; s|href="favicon.svg"|href="favicon.svg?v=${{ github.sha }}"|' index.html
          grep -q 'app.css?v=' index.html
          # SPA deep links (/editor) hit Pages' 404 page, which is the app itself.
          cp index.html 404.html
          # Lets a running page notice a newer deploy (brain 0025). Fetched with cache: no-store.
          printf '{"sha":"%s","time":"%s"}\n' "${{ github.sha }}" "$BUILD_TIME" > build-info.json
          # Do not run Jekyll (it would drop the _framework folder).
          touch .nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
