<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beesharp · Plan Editing (Draft)</title>
<style>
  /* ==========================================================================
     Beesharp Design System (Grafana cool slate dark + Brain 0016, 0018, 0066, 0068)
     Colour carries meaning ONLY:
       --good (#34d399)    = healthy / ok
       --slow (#fbbf24)    = slow / schema drift warning
       --failed (#f05252)  = failed / error / destructive
       --running (#5b9bf0) = active bees in flight / history mode
     Selection, focus & primary actions are crisp neutral light.
     ========================================================================== */
  :root {
    color-scheme: dark;
    --bg: #181b1f;
    --panel: #22252b;
    --panel2: #2c3038;
    --panel3: #353a44;
    --input: #1b1e23;
    --card-bg: #1e2128;
    --card-hover: #232730;
    --selected: #282d37;
    --border: rgba(204, 204, 220, 0.13);
    --border-subtle: rgba(204, 204, 220, 0.075);
    --border-strong: rgba(227, 228, 236, 0.30);

    --text: #e3e4ec;
    --title: #ffffff;
    --muted: #9da2b3;
    --faint: #72788a;
    --accent: #e6e7ef;
    --accent2: #cdd0db;

    --good: #34d399;
    --slow: #fbbf24;
    --failed: #f05252;
    --running: #5b9bf0;

    --failed-bar: color-mix(in srgb, var(--failed) 86%, var(--card-bg));
    --slow-bar: color-mix(in srgb, var(--slow) 86%, var(--card-bg));

    --radius: 12px;
    --radius-sm: 9px;
    --radius-xs: 6px;

    --sans: "Inter", "Segoe UI Variable Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;

    --proto-h: 38px;
    --top-h: 54px;
    --drawer-w: 416px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.42;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  .mono { font-family: var(--mono); }
  .tnum { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .spacer { flex: 1 1 auto; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Prototype Studio Bar ---------- */
  .proto-bar {
    position: sticky;
    top: 0;
    z-index: 120;
    min-height: var(--proto-h);
    background: #111317;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding: 4px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 11.5px;
    color: var(--muted);
  }
  .proto-tag {
    font-weight: 700;
    font-size: 10.5px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--title);
    background: rgba(255, 255, 255, 0.08);
    padding: 2px 7px;
    border-radius: 5px;
  }
  .proto-group { display: inline-flex; align-items: center; gap: 6px; }
  .proto-lbl { color: var(--faint); font-weight: 500; }
  .proto-pills {
    display: inline-flex;
    background: #1a1d23;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px;
    gap: 2px;
  }
  .proto-pills button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    font-weight: 500;
    padding: 2px 9px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.14s, color 0.14s;
  }
  .proto-pills button:hover { color: var(--title); }
  .proto-pills button.on {
    background: var(--text);
    color: #14161a;
    font-weight: 600;
  }
  .proto-jump {
    border: 1px solid var(--border);
    background: #1a1d23;
    color: var(--muted);
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.14s, color 0.14s, background-color 0.14s;
  }
  .proto-jump:hover {
    color: var(--title);
    border-color: var(--border-strong);
    background: var(--panel);
  }

  /* Phone viewport simulator frame */
  .viewport-wrap.is-phone {
    background: #0d0f12;
    min-height: calc(100vh - var(--proto-h));
    display: flex;
    justify-content: center;
    padding: 20px 12px;
  }
  .viewport-wrap.is-phone .app-frame {
    width: 390px;
    height: 820px;
    border-radius: 34px;
    border: 6px solid #2a2e37;
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.75);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    transform: translateZ(0);
  }

  /* ---------- Core Controls ---------- */
  .btn {
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 0.4rem 0.9rem;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text);
    background: var(--panel2);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.38rem;
    white-space: nowrap;
    transition: background-color 0.14s, border-color 0.14s, color 0.14s, transform 0.08s;
  }
  .btn:hover:not(:disabled) { background: var(--panel3); color: var(--title); }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:disabled { opacity: 0.38; cursor: default; }
  .btn.primary {
    background: var(--text);
    color: #16181d;
    font-weight: 650;
  }
  .btn.primary:hover:not(:disabled) { background: #ffffff; color: #111317; }
  .btn.ghost {
    background: var(--panel2);
    border-color: var(--border);
    font-weight: 500;
  }
  .btn.ghost:hover:not(:disabled) {
    background: var(--panel3);
    border-color: var(--border-strong);
  }
  .btn.ghost.danger-hover:hover:not(:disabled) {
    background: rgba(240, 82, 82, 0.14);
    border-color: rgba(240, 82, 82, 0.38);
    color: #fca5a5;
  }
  .btn.sm { padding: 0.3rem 0.74rem; font-size: 0.77rem; }
  .btn.xs { padding: 0.18rem 0.56rem; font-size: 0.72rem; }

  .icon-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 0;
    background: transparent;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex: none;
    transition: background-color 0.14s, color 0.14s;
  }
  .icon-btn:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.09);
    color: var(--title);
  }
  .icon-btn.danger:hover:not(:disabled) {
    background: rgba(240, 82, 82, 0.16);
    color: var(--failed);
  }
  .icon-btn.xs { width: 24px; height: 24px; }
  .icon-btn:disabled { opacity: 0.35; cursor: default; }

  .ico {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
    display: block;
  }
  .ico.sm { width: 13.5px; height: 13.5px; }
  .ico.xs { width: 12.5px; height: 12.5px; }

  .seg {
    display: inline-flex;
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px;
    gap: 2px;
  }
  .seg button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 0.77rem;
    font-weight: 500;
    padding: 0.24rem 0.7rem;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 0.14s, color 0.14s;
  }
  .seg button:hover:not(:disabled) { color: var(--text); }
  .seg button.on {
    background: var(--text);
    color: #16181d;
    font-weight: 600;
  }

  .meta-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.68rem;
    font-weight: 600;
    font-family: var(--mono);
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.055);
    border: 1px solid var(--border);
    color: var(--muted);
    white-space: nowrap;
  }

  /* ---------- App Top Bar ---------- */
  .topbar {
    position: sticky;
    top: var(--proto-h);
    z-index: 80;
    height: var(--top-h);
    background: rgba(24, 27, 31, 0.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-subtle);
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .viewport-wrap.is-phone .topbar {
    top: 0;
    padding: 0 12px;
    height: 50px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--title);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.015em;
    text-decoration: none;
    flex: none;
  }
  .nav {
    display: flex;
    align-items: stretch;
    height: 100%;
    gap: 2px;
  }
  .nav-item {
    border: 0;
    background: none;
    padding: 0 12px;
    color: var(--muted);
    font-weight: 500;
    font-size: 13.5px;
    border-bottom: 2.5px solid transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    transition: color 0.14s;
  }
  .nav-item:hover { color: var(--text); }
  .nav-item.active {
    color: var(--title);
    font-weight: 600;
    border-bottom-color: var(--text);
  }
  .top-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .top-pill {
    height: 30px;
    padding: 0 11px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 0.77rem;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.14s, border-color 0.14s;
  }
  .top-pill:hover, .top-pill.on {
    background: var(--panel2);
    border-color: var(--border-strong);
  }
  .top-pill.history {
    background: rgba(91, 155, 240, 0.12);
    border-color: rgba(91, 155, 240, 0.42);
    color: #bfdbfe;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--good);
    flex: none;
  }
  .status-dot.run {
    background: var(--running);
    box-shadow: 0 0 8px var(--running);
  }
  .caret { color: var(--muted); font-size: 0.68rem; }

  /* ---------- DropMenu ---------- */
  .dd { position: relative; }
  .dd-backdrop { position: fixed; inset: 0; z-index: 88; }
  .dd-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 95;
    min-width: 280px;
    max-width: min(360px, 92vw);
    background: #242830;
    border: 1px solid rgba(227, 228, 236, 0.14);
    border-radius: 14px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.72);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .dd-head { padding: 8px 8px 6px; border-bottom: 1px solid var(--border-subtle); }
  .dd-filter { padding: 6px 6px 2px; }
  .dd-filter input {
    width: 100%;
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 0.79rem;
    outline: none;
  }
  .dd-filter input:focus { border-color: var(--border-strong); }
  .dd-scroll {
    max-height: 320px;
    overflow-y: auto;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .dd-lbl {
    font-size: 0.65rem;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--faint);
    padding: 6px 10px 3px;
  }
  .dd-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 9px;
    border: 0;
    background: transparent;
    width: 100%;
    text-align: left;
    cursor: pointer;
    transition: background-color 0.12s;
  }
  .dd-row:hover:not(:disabled) { background: rgba(255, 255, 255, 0.07); }
  .dd-row.on { background: rgba(255, 255, 255, 0.06); font-weight: 600; color: var(--title); }
  .dd-row:disabled { opacity: 0.4; cursor: default; }
  .dd-check { width: 14px; text-align: center; color: var(--title); font-size: 0.8rem; flex: none; }
  .dd-main { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-sub { display: block; font-size: 0.72rem; color: var(--muted); font-weight: 400; margin-top: 1px; }
  .dd-inline-act {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 0.7rem;
    font-weight: 550;
    padding: 2px 8px;
    border-radius: 999px;
    cursor: pointer;
    flex: none;
  }
  .dd-inline-act:hover { background: var(--panel3); border-color: var(--border-strong); color: var(--title); }

  /* ---------- Main Workspace Shell ---------- */
  .workspace {
    display: flex;
    align-items: stretch;
    min-height: calc(100vh - var(--proto-h) - var(--top-h));
    position: relative;
  }
  .viewport-wrap.is-phone .workspace {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding-bottom: 64px;
  }
  .page-wrap {
    flex: 1 1 auto;
    min-width: 0;
    max-width: 1280px;
    margin: 0 auto;
    padding: 16px 22px 44px;
    width: 100%;
  }
  .workspace.has-drawer .page-wrap {
    max-width: none;
    padding-right: 18px;
  }
  .viewport-wrap.is-phone .page-wrap {
    padding: 12px 12px 24px;
  }

  /* ---------- Plan Header ---------- */
  .plan-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px 14px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .plan-identity {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    min-width: 0;
  }
  .plan-identity h1 {
    margin: 0;
    font-size: 1.18rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--title);
  }
  .plan-sub-state {
    color: var(--muted);
    font-size: 0.78rem;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .plan-toolbar {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
    margin-left: auto;
  }

  /* ---------- Unified Run & Plan Bar ---------- */
  .launch-bar {
    display: flex;
    align-items: center;
    gap: 8px 12px;
    flex-wrap: wrap;
    padding: 8px 11px 8px 9px;
    margin-bottom: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .start-pill {
    border: 0;
    border-radius: 999px;
    padding: 5px 14px 5px 6px;
    background: var(--text);
    color: #16181d;
    font-weight: 650;
    font-size: 0.83rem;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    flex: none;
    transition: background-color 0.14s, transform 0.08s;
  }
  .start-pill:hover:not(:disabled) { background: #ffffff; }
  .start-pill:disabled { opacity: 0.4; cursor: default; }
  .start-pill.running {
    background: rgba(91, 155, 240, 0.16);
    border: 1px solid rgba(91, 155, 240, 0.45);
    color: #bfdbfe;
  }
  .start-disc {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #16181d;
    color: var(--text);
    display: grid;
    place-items: center;
    flex: none;
  }
  .start-pill.running .start-disc {
    background: var(--running);
    color: #0e1726;
  }
  .launch-dur {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1 1 200px;
    min-width: 180px;
    max-width: 310px;
  }
  .launch-dur label {
    font-size: 0.74rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .launch-chips {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-left: auto;
  }
  .plan-pill {
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.025);
    color: var(--muted);
    border-radius: 7px;
    padding: 4px 9px;
    font-size: 0.73rem;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    transition: background-color 0.14s, border-color 0.14s, color 0.14s;
  }
  .plan-pill:hover {
    background: var(--panel2);
    border-color: var(--border-strong);
    color: var(--title);
  }
  .plan-pill b { color: var(--text); font-weight: 600; font-family: var(--mono); font-size: 0.72rem; }
  .plan-pill.active {
    border-color: var(--accent2);
    background: var(--selected);
    color: var(--title);
  }

  /* Stored Run History Banner */
  .history-banner {
    background: var(--panel);
    border: 1px solid rgba(91, 155, 240, 0.35);
    border-radius: var(--radius);
    padding: 11px 14px;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .history-banner-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .history-tag {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(91, 155, 240, 0.18);
    color: var(--running);
  }
  .history-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    padding: 7px 11px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.03);
    font-size: 0.78rem;
    color: var(--muted);
  }
  .history-stats b { color: var(--title); }
  .history-stats .good b { color: var(--good); }
  .history-stats .bad b { color: var(--failed); }
  .history-stats .warn b { color: var(--slow); }

  /* Empty Plan State */
  .empty-plan {
    background: var(--panel);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 44px 24px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
  }
  .empty-plan h2 { margin: 0; font-size: 1.02rem; color: var(--title); }
  .empty-plan p { margin: 0; color: var(--muted); max-width: 360px; font-size: 0.83rem; }

  /* ==========================================================================
     Compact Technical Scenario Boxes (High Information Density, Sharp Geometry)
     ========================================================================== */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
    gap: 10px;
    align-items: stretch;
  }
  .viewport-wrap.is-phone .cards-grid {
    grid-template-columns: 1fr;
    gap: 8px;
  }
  .sc-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-left: 2.5px solid rgba(204, 204, 220, 0.22);
    border-radius: 9px;
    padding: 0;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    overflow: hidden;
    transition: background-color 0.12s, border-color 0.12s, box-shadow 0.12s;
  }
  .sc-card:hover {
    background: var(--card-hover);
    border-color: rgba(227, 228, 236, 0.24);
    border-left-color: var(--muted);
  }
  .sc-card.selected {
    background: var(--selected);
    border-color: var(--accent2);
    border-left-color: var(--title);
    box-shadow: 0 0 0 1px rgba(227, 228, 236, 0.22), 0 8px 22px -12px rgba(0, 0, 0, 0.7);
  }

  /* Box Header Strip */
  .sc-head {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 9px 7px 10px;
    background: rgba(24, 27, 31, 0.42);
    border-bottom: 1px solid var(--border-subtle);
  }
  .sc-idx {
    font-family: var(--mono);
    font-size: 0.67rem;
    font-weight: 700;
    color: var(--faint);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    padding: 1px 5px;
    flex: none;
  }
  .sc-card.selected .sc-idx {
    background: var(--text);
    color: #16181d;
    border-color: transparent;
  }
  .sc-title-wrap { flex: 1 1 auto; min-width: 0; }
  .sc-name {
    display: block;
    font-size: 0.85rem;
    font-weight: 650;
    color: var(--title);
    letter-spacing: -0.01em;
    line-height: 1.25;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sc-type {
    display: block;

// =============================================================================
// 2. Formatting Helpers
// =============================================================================
function fmtVal(v, f) {
  if (v === null || v === undefined) return '—';
  if (Array.isArray(v)) return `${v.length} paths`;
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  return v + (f?.unit ? ' ' + f.unit : '');
}

function fmtCompactNum(n) {
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
  return String(n);
}

function fmtDurationHuman(sec) {
  if (sec < 60) return `${sec}s`;
  const m = Math.floor(sec / 60), s = sec % 60;
  return s ? `${m}m ${s}s` : `${m}m`;
}

function planSummaryText(p) {
  const totalRate = p.entries.reduce((s, e) => s + effectiveRate(e), 0);
  const est = Math.round(totalRate * (p.duration / 60));
  return `${p.entries.length} ${p.entries.length === 1 ? 'scenario' : 'scenarios'} · ${totalRate} bees/min · ~${fmtCompactNum(est)} bees`;
}

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function resolvePlaceholders(str) {
  if (typeof str !== 'string' || !str.includes('{{')) return null;
  const map = ENVS[state.env] || {};
  let hasUnknown = false;
  const resolved = str.replace(/\{\{(\w+)\}\}/g, (_, key) => {
    if (key in map) return map[key];
    hasUnknown = true;
    return `{{${key}}}`;
  });
  return { resolved, hasUnknown };
}

function showToast(msg, withUndo = false) {
  state.toast = { msg, withUndo };
  render();
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { state.toast = null; render(); }, 4000);
}

function renderMiniBars(seed, hasFailed, hasSlow, count = 30) {
  let out = '';
  for (let i = 0; i < count; i++) {
    const x = Math.sin(seed * 91.3 + i * 17.7) * 10000;
    const r = x - Math.floor(x);
    let cls = '';
    if (hasFailed && (i === 9 || i === 21)) cls = 'bad';
    else if (hasSlow && (i === 5 || i === 15 || i === 25)) cls = 'warn';
    const h = cls === 'bad' ? 88 : cls === 'warn' ? 76 : Math.round(28 + r * 42);
    out += `<i class="${cls}" style="height:${h}%"></i>`;
  }
  return `<div class="sc-chart" aria-hidden="true">${out}</div>`;
}

function sliderPct(v, min, max) {
  if (max <= min) return 0;
  return Math.max(0, Math.min(100, ((v - min) / (max - min)) * 100)).toFixed(1);
}

function renderControl(f, v, e, ro) {
  const id = `${e}:${f.k}`;
  if (ro) {
    if (Array.isArray(v)) return `<span class="mono" style="font-size:0.76rem">${v.map(esc).join(', ')}</span>`;
    return `<span class="${f.mono || f.t === 'int' || f.t === 'float' ? 'mono' : ''}">${esc(fmtVal(v, f))}</span>`;
  }
  if (f.t === 'bool') {
    return `<button type="button" class="bs-toggle ${v ? 'on' : ''}" data-toggle="${id}" role="switch" aria-checked="${!!v}"><i></i></button>
            <span class="muted mono" style="font-size:0.75rem">${v ? 'true' : 'false'}</span>`;
  }
  if (f.t === 'enum') {
    return `<select class="bs-select" data-input="${id}">${f.opts.map(o => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  }
  if (f.t === 'text') {
    return `<input type="text" class="bs-text ${f.mono ? 'mono' : ''}" data-input="${id}" value="${esc(v ?? '')}" autocomplete="off" spellcheck="false">`;
  }
  const step = f.step || (f.t === 'float' ? 0.1 : 1);
  const pct = sliderPct(v, f.min, f.max);
  return `<div class="slider-group">
    <input type="range" class="bs-range" style="--pct:${pct}%" data-range="${id}" min="${f.min}" max="${f.max}" step="${step}" value="${v}">
    <div class="num-unit-box">
      <input type="number" class="bs-num" data-num="${id}" min="${f.min}" max="${f.max}" step="${step}" value="${v}">
      ${f.unit ? `<span class="bs-unit">${esc(f.unit)}</span>` : ''}
    </div>
  </div>`;
}

function renderFieldRow(f, v, e, ro, extra = {}) {
  if (f.t === 'list' && !ro) {
    const arr = Array.isArray(v) ? v : [];
    return `<div class="p-row" data-row="${e}:${f.k}">
      <div class="p-lbl"><span>${esc(f.l)}</span></div>
      <div class="p-ctl"><span class="muted mono" style="font-size:0.74rem">${arr.length} path${arr.length === 1 ? '' : 's'}</span></div>
      <div class="url-list">
        ${arr.map((u, idx) => `<div class="url-row">
          <span class="url-idx">${idx + 1}</span>
          <input type="text" class="bs-text mono" data-list-input="${e}:${f.k}:${idx}" value="${esc(u)}" spellcheck="false">
          <button type="button" class="icon-btn xs danger" data-list-del="${e}:${f.k}:${idx}" title="Remove URL" ${arr.length <= 1 ? 'disabled' : ''}>${ICONS.close}</button>
        </div>`).join('')}
        <div><button type="button" class="btn ghost xs" data-list-add="${e}:${f.k}">+ Add step URL</button></div>
      </div>
    </div>`;
  }

  const cls = ['p-row', ro ? 'ro' : '', extra.gone ? 'gone' : ''].filter(Boolean).join(' ');
  const hasRange = !ro && f.min !== undefined;
  const resolvedInfo = !ro && f.t === 'text' ? resolvePlaceholders(v) : null;

  let metaHtml = '';
  if (hasRange || extra.note) {
    metaHtml = `<div class="p-meta">
      <span>${extra.note || ''}</span>
      ${hasRange ? `<span class="p-bounds">${f.min}–${f.max}${f.unit ? ' ' + f.unit : ''}</span>` : ''}
    </div>`;
  }

  const envHtml = resolvedInfo
    ? `<div class="p-env-preview" data-envprev="${e}:${f.k}">
        <span class="faint">→</span>
        <span class="${resolvedInfo.hasUnknown ? 'warn' : ''}">${esc(resolvedInfo.resolved)}</span>
        <span class="faint">(${esc(state.env)})</span>
      </div>`
    : '';

  return `<div class="${cls}" data-row="${e}:${f.k}">
    <div class="p-lbl" title="${esc(f.k)}"><span>${esc(f.l)}</span></div>
    <div class="p-ctl">${renderControl(f, v, e, ro)}</div>
    ${envHtml}${metaHtml}
  </div>`;
}

function renderEntryForm(idx, ro = false) {
  const en = state.current.entries[idx];
  const sc = CATALOG[en.sc];
  const lock = ro || state.isRunning;

  let html = `<div class="param-sec-head"><span>Identity &amp; Spawning</span><span class="mono tnum" style="color:var(--text)" data-effrate="${idx}">${effectiveRate(en)} bees/min</span></div>`;
  html += `<div class="param-list">`;
  html += renderFieldRow({ k: 'label', l: 'Entry label', t: 'text' }, en.label, idx, lock);

  html += `<div class="p-row">
    <div class="p-lbl"><span>Pattern</span></div>
    <div class="p-ctl">
      <div class="seg">
        <button type="button" class="${en.pattern === 'linear' ? 'on' : ''}" data-pattern="${idx}:linear" ${lock ? 'disabled' : ''}>Linear</button>
        <button type="button" class="${en.pattern === 'bursts' ? 'on' : ''}" data-pattern="${idx}:bursts" ${lock ? 'disabled' : ''}>Bursts</button>
      </div>
    </div>
  </div>`;

  if (en.pattern === 'bursts') {
    html += renderFieldRow(SPAWN_FIELDS[1], en.burstSize, idx, lock);
    html += renderFieldRow(SPAWN_FIELDS[2], en.burstRate, idx, lock);
  } else {
    html += renderFieldRow(SPAWN_FIELDS[0], en.rate, idx, lock);
  }
  html += renderFieldRow(SPAWN_FIELDS[3], en.maxInFlight, idx, lock);
  html += `</div>`;

  let curGroup = null;
  sc.params.forEach(f => {
    if (f.g !== curGroup) {

      curGroup = f.g;
      html += `<div class="param-sec-head"><span>${esc(curGroup)}</span></div><div class="param-list">`;
    }
    html += renderFieldRow(f, en.params[f.k], idx, lock);
  });
  if (curGroup !== null) html += `</div>`;
  return html;
}

function renderPlanForm(ro = false) {
  const lock = ro || state.isRunning;

    if (f.g !== curGroup) {

      curGroup = f.g;
      html += `<div class="param-sec-head"><span>${esc(curGroup)}</span></div><div class="param-list">`;
    }
    html += renderFieldRow(f, state.current[f.k], -1, lock);
  });
  if (curGroup !== null) html += `</div>`;
  return html;
}

function renderEmptyPlan() {

    <h2>Current plan is empty</h2>
    <p>Add a scenario from the catalog or load a starter preset to begin configuring your load mix.</p>
    <div style="display:flex;gap:8px;margin-top:6px">

      <button type="button" class="btn primary sm" data-open-add>+ Add scenario</button>
    </div>
  </section>`;
}

function renderCardsGrid() {
  const plan = state.viewingRunId ? RUNS.find(r => r.id === state.viewingRunId).plan : state.current;
  const ro = !!state.viewingRunId;
  if (!ro && plan.entries.length === 0) return renderEmptyPlan();

  const totalRate = plan.entries.reduce((s, e) => s + effectiveRate(e), 0);

  const cards = plan.entries.map((en, idx) => {
    const sc = CATALOG[en.sc];
    const numTag = String(idx + 1).padStart(2, '0');

    if (!sc) {
      return `<article class="sc-card" style="border-left-color:var(--failed)">
        <div class="sc-head">
          <span class="sc-idx">#${numTag}</span>
          <div class="sc-title-wrap"><span class="sc-name">${esc(en.label)}</span><span class="sc-type">${esc(en.sc)}</span></div>
          <span class="drift-chip bad">unknown</span>
        </div>
        <div style="padding:10px"><div class="callout bad" style="margin:0"><div>Scenario “${esc(en.sc)}” is no longer registered. Click “Inspect run setup” above to view stored parameters.</div></div></div>
      </article>`;
    }

    if (ro) {
      const st = sc.stats;
      return `<article class="sc-card" style="cursor:default">
        <div class="sc-head">
          <span class="sc-idx">#${numTag}</span>
          <div class="sc-title-wrap"><span class="sc-name">${esc(en.label)}</span><span class="sc-type">${esc(sc.codeId)} · ${effectiveRate(en)}/min</span></div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;padding:9px 10px 4px">
          <span class="sc-rate-val" style="${st.failed === 0 && st.slow === 0 ? 'color:var(--good)' : ''}">${st.okPct.toFixed(1)}<small>% ok</small></span>
          <span class="spacer"></span>
          ${st.failed > 0 ? `<span class="sc-badge bad">${hexIcon('bad')} ${st.failed}</span>` : ''}
          ${st.slow > 0 ? `<span class="sc-badge warn">${hexIcon('warn')} ${st.slow}</span>` : ''}
        </div>
        ${renderMiniBars(idx + 2, st.failed > 0, st.slow > 0)}
      </article>`;
    }

    const rate = effectiveRate(en);
    const sharePct = totalRate > 0 ? Math.round((rate / totalRate) * 100) : 0;
    const estBees = Math.round(rate * (plan.duration / 60));
    const patLabel = en.pattern === 'bursts' ? `BURST ${en.burstSize}×${en.burstRate}` : 'LINEAR';
    const isSel = state.openTarget === idx;

    const specItems = sc.params.map(f => {
      const valStr = fmtVal(en.params[f.k], f);
      return `<div class="spec-item ${f.wide ? 'wide' : ''}">
        <span class="spec-k">${esc(f.sk || f.k)}</span>
        <span class="spec-v" data-card-kv="${idx}:${f.k}" title="${esc(f.l)}: ${esc(valStr)}">${esc(valStr)}</span>
      </div>`;
    }).join('');

    const stepNodes = sc.steps.map((step, sIdx) =>
      `${sIdx > 0 ? '<span class="step-sep">›</span>' : ''}<span class="step-node"><i>${String(step.n).padStart(2, '0')}</i>${esc(step.name)}</span>`
    ).join('');

    return `<article class="sc-card ${isSel ? 'selected' : ''}" data-select-target="${idx}">
      <div class="sc-head">
        <span class="sc-idx">#${numTag}</span>
        <div class="sc-title-wrap">
          <span class="sc-name" data-card-label="${idx}">${esc(en.label)}</span>
          <span class="sc-type">${esc(sc.codeId)}</span>
        </div>
        <div class="sc-actions" onclick="event.stopPropagation()">
          <button type="button" class="icon-btn xs" ${state.isRunning ? 'disabled' : ''} data-dup-entry="${idx}" title="Duplicate">${ICONS.copy}</button>
          <button type="button" class="icon-btn xs danger" ${state.isRunning ? 'disabled' : ''} data-delete-entry="${idx}" title="Remove">${ICONS.trash}</button>
        </div>
      </div>

      <div class="sc-telemetry">
        <div class="sc-rate-row">
          ${state.isRunning
            ? `<span class="sc-rate-val run">${12 + idx * 7}<small>active</small></span>`
            : `<span class="sc-rate-val"><span data-card-rate="${idx}">${rate}</span><small>bees/min</small></span>`}
          <span class="meta-badge" data-card-pat="${idx}">${esc(patLabel)}</span>
        </div>
        <div class="share-track" title="${sharePct}% of total plan rate">
          <i data-card-sharebar="${idx}" style="width:${sharePct}%"></i>
        </div>
        <div class="sc-kpis">
          <div class="sc-kpi"><span>mix</span><b data-card-share="${idx}">${sharePct}%</b></div>
          <div class="sc-kpi"><span>est</span><b data-card-est="${idx}">~${fmtCompactNum(estBees)}</b></div>
          <div class="sc-kpi"><span>cap</span><b data-card-maxinf="${idx}">${en.maxInFlight}</b></div>
        </div>
      </div>

      <div class="spec-grid">${specItems}</div>

      <div class="step-pipe" title="Declared scenario pipeline">${stepNodes}</div>
    </article>`;
  }).join('');

  const addTile = ro ? '' : `<button type="button" class="card-add" ${state.isRunning ? 'disabled' : ''} data-open-add>
    <span class="plus-ring">+</span>
    <b style="font-size:0.8rem">Add scenario</b>
    <span class="mono" style="font-size:0.68rem;color:var(--faint)">Append to load mix</span>
  </button>`;

  return `<div class="cards-grid">${cards}${addTile}</div>`;
}

function renderInspectorDrawer(inSheet = false) {
  if (state.viewingRunId) return '';
  if (inSheet && state.openTarget === null) return '';

  const t = state.openTarget;
  const isPlan = t === -1;
  const en = (t !== null && !isPlan) ? state.current.entries[t] : null;
  const sc = en ? CATALOG[en.sc] : null;

  let inner;
  if (t === null || (!isPlan && !en)) {
    inner = `<div class="insp-idle">
      <div>Select a scenario box or <b>Plan settings</b> to configure parameters.</div>
    </div>`;
  } else {
    const kicker = isPlan ? 'PLAN CONFIGURATION' : `ENTRY #${String(t + 1).padStart(2, '0')} · ${sc.codeId}`;
    const subTitle = isPlan
      ? 'Duration, concurrency ceiling & lifecycle hooks'
      : (sc.name.toLowerCase() === en.label.toLowerCase() ? sc.desc : sc.name);

    inner = `<div class="insp-head">
      <div class="insp-head-titles">
        <div class="kicker">${esc(kicker)}</div>
        <h2>${isPlan ? 'Plan &amp; Lifecycle' : esc(en.label)}</h2>
        <div class="sub">${esc(subTitle)}</div>
      </div>
      ${!isPlan ? `<button type="button" class="icon-btn danger" ${state.isRunning ? 'disabled' : ''} data-delete-entry="${t}" title="Remove entry from plan">${ICONS.trash}</button>` : ''}
      <button type="button" class="icon-btn" data-close-inspector title="Close panel">${ICONS.close}</button>
    </div>
    <div class="insp-body">
      ${state.isRunning ? `<div class="callout neutral"><div>Run in progress — stop the run to edit parameters.</div></div>` : ''}
      ${isPlan ? renderPlanForm() : renderEntryForm(t)}
    </div>`;
  }

  if (inSheet) {
    return `<div class="phone-sheet-shade" data-close-inspector></div>
      <aside class="phone-sheet" aria-label="Inspector"><div class="sheet-grab"><i></i></div>${inner}</aside>`;
  }
  return `<aside class="inspector-drawer" aria-label="Scenario and plan inspector">${inner}</aside>`;
}

function renderModal() {
  const d = state.dialog;
  if (!d) return '';

  if (d.type === 'add') {
    return modalShell(
      `Add scenario to current plan`,
      `<div style="display:flex;flex-direction:column;gap:8px">
        ${Object.entries(CATALOG).map(([id, sc]) => `<button type="button" class="pick-card" data-add-sc="${id}">
          <div style="flex:1">
            <b style="color:var(--title)">${esc(sc.name)}</b> <span class="mono faint" style="font-size:0.72rem;margin-left:5px">${esc(sc.codeId)}</span>
            <div class="muted" style="font-size:0.76rem;margin-top:2px">${esc(sc.desc)}</div>
          </div>
          <span class="meta-badge">${sc.params.length}p · ${sc.steps.length}s</span>
        </button>`).join('')}
      </div>`,
      `<button type="button" class="btn ghost sm" data-close-dlg>Cancel</button>`
    );
  }

  if (d.type === 'inspect') {
    return renderInspectRunModal(d.id);
  }
  return '';
}

function renderInspectRunModal(runId) {
  const r = RUNS.find(x => x.id === runId);
  const p = r.plan;
  let addedCount = 0, goneCount = 0, unknownScCount = 0;

  p.entries.forEach(en => {
    const sc = CATALOG[en.sc];
    if (!sc) { unknownScCount++; return; }
    const known = new Set(sc.params.map(f => f.k));
    sc.params.forEach(f => { if (!(f.k in en.params)) addedCount++; });
    Object.keys(en.params).forEach(k => { if (!known.has(k)) goneCount++; });
  });

  const sections = [];
  sections.push(`<div class="param-sec-head" style="margin-top:6px"><span>Plan Limits &amp; Programs</span></div><div class="param-list">
    ${PLAN_FIELDS.map(f => renderFieldRow(f, p[f.k], -1, true)).join('')}
  </div>`);

  p.entries.forEach((en, i) => {
    const sc = CATALOG[en.sc];
    sections.push(`<div class="param-sec-head"><span>Entry #${String(i + 1).padStart(2, '0')} · ${esc(en.label)}</span><span class="mono">${sc ? esc(sc.codeId) : esc(en.sc)}</span></div>`);
    if (!sc) {
      sections.push(`<div class="callout bad"><div>Scenario <b>“${esc(en.sc)}”</b> is no longer registered on this server. Stored values are shown below; loading this run skips this entry.</div></div>
        <div class="param-list">${Object.entries(en.params).map(([k, v]) => renderFieldRow({ k, l: k, t: 'text', mono: true }, v, i, true)).join('')}</div>`);
      return;
    }
    const rows = [];
    rows.push(renderFieldRow(SPAWN_FIELDS[0], effectiveRate(en), i, true));
    rows.push(renderFieldRow(SPAWN_FIELDS[3], en.maxInFlight, i, true));
    const known = new Set(sc.params.map(f => f.k));
    sc.params.forEach(f => {
      const has = f.k in en.params;
      rows.push(renderFieldRow(
        f,
        has ? en.params[f.k] : f.d,
        i,
        true,
        has ? {} : { note: `<span class="drift-chip warn">Added since run · uses default ${esc(fmtVal(f.d, f))}</span>` }
      ));
    });
    Object.keys(en.params).filter(k => !known.has(k)).forEach(k => {
      rows.push(renderFieldRow(
        { k, l: k, t: 'text', mono: true },
        en.params[k],
        i,
        true,
        { gone: true, note: `<span class="drift-chip warn">Removed from code · dropped when loaded</span>` }
      ));
    });
    sections.push(`<div class="param-list">${rows.join('')}</div>`);
  });

  const hasDrift = addedCount || goneCount || unknownScCount;
  return modalShell(
    `Run #${r.id} Setup Snapshot`,
    `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:0.79rem" class="muted">
      <span>${esc(r.when)}</span><span>·</span>
      <span>Environment: <b style="color:var(--text)">${esc(r.env)}</b></span><span>·</span>
      <span style="color:${r.failed > 0 ? 'var(--failed)' : 'var(--good)'};font-weight:600">${r.okPct}% ok</span>
    </div>
    ${hasDrift ? `<div class="callout warn">
      <div><b>Code evolved since Run #${r.id}:</b>
        ${[
          unknownScCount ? `${unknownScCount} scenario no longer registered` : '',
          addedCount ? `${addedCount} new parameter (uses default)` : '',
          goneCount ? `${goneCount} retired parameter (ignored on load)` : ''
        ].filter(Boolean).join(' · ')}.
      </div>
    </div>` : `<div class="callout neutral"><div>Stored snapshot is 100% compatible with current scenario definitions.</div></div>`}
    ${sections.join('')}`,
    `<button type="button" class="btn ghost sm" data-close-dlg>Close</button>
     <button type="button" class="btn primary sm" data-load-from-run="${r.id}">
       Load into current plan${unknownScCount ? ' (compatible entries)' : ''}
     </button>`
  );
}

function modalShell(title, body, foot) {
  return `<div class="modal-shade" data-shade-close>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3>${title}</h3>
        <button type="button" class="icon-btn xs" data-close-dlg aria-label="Close">${ICONS.close}</button>
      </div>
      <div class="modal-body">${body}</div>
      <div class="modal-foot">${foot}</div>
    </div>
  </div>`;
}

// 8. Root Render + Smooth 60fps Live Updates
// =============================================================================
function render() {
  const isPhone = state.viewport === 'phone';
  const showDesktopDrawer = !isPhone && !state.viewingRunId;
  const showPhoneSheet = (isPhone || window.innerWidth <= 860) && !state.viewingRunId && state.openTarget !== null;

  const phoneTabBar = isPhone ? `<nav class="phone-tabbar" aria-label="Mobile tabs">
    <button type="button" class="on">Overview</button>
    <button type="button" data-nav-toast="Calls">Calls</button>
    <button type="button" data-nav-toast="Editor">Editor</button>
    <button type="button" data-nav-toast="Logs">Logs</button>
    <button type="button" data-nav-toast="Environment">Env</button>
  </nav>` : '';

  document.getElementById('root').innerHTML = `
    ${renderProtoBar()}
    <div class="viewport-wrap ${isPhone ? 'is-phone' : ''}">
      <div class="app-frame">
        ${renderTopBar()}
        <div class="workspace ${showDesktopDrawer ? 'has-drawer' : ''}">
          <main class="page-wrap">
            ${renderPlanHeader()}
            ${renderLaunchOrHistoryBar()}
            ${renderCardsGrid()}
          </main>
          ${showDesktopDrawer ? renderInspectorDrawer(false) : ''}
        </div>
        ${showPhoneSheet ? renderInspectorDrawer(true) : ''}
        ${phoneTabBar}
      </div>
    </div>
    ${renderModal()}
    ${state.toast ? `<div class="toast"><span>${esc(state.toast.msg)}</span>${state.toast.withUndo ? `<button type="button" class="toast-undo" data-undo-plan>Undo</button>` : ''}</div>` : ''}
  `;
}

function mutateField(e, k, val, skipFullRender = false) {
  if (e < 0) {
    state.current[k] = val;
  } else {
    const en = state.current.entries[e];
    if (k in en && k !== 'params') en[k] = val;
    else en.params[k] = val;
  }
  if (!skipFullRender) {
    render();
    return;
  }
  const id = `${e}:${k}`;
  document.querySelectorAll(`[data-range="${id}"]`).forEach(r => {
    if (r !== document.activeElement) r.value = val;
    r.style.setProperty('--pct', sliderPct(val, +r.min, +r.max) + '%');
  });
  document.querySelectorAll(`[data-num="${id}"]`).forEach(n => {
    if (n !== document.activeElement) n.value = val;
  });
  if (e === -1 && k === 'duration') {
    document.querySelectorAll('[data-dur-human]').forEach(el => { el.textContent = fmtDurationHuman(val); });
  }
  if (e >= 0) {
    document.querySelectorAll(`[data-effrate="${e}"]`).forEach(el => {
      el.textContent = effectiveRate(state.current.entries[e]) + ' bees/min';
    });
  }
  const summaryEl = document.querySelector('[data-plan-summary]');
  if (summaryEl) summaryEl.textContent = planSummaryText(state.current);

  const totalRate = state.current.entries.reduce((s, item) => s + effectiveRate(item), 0);
  state.current.entries.forEach((item, idx) => {
    const r = effectiveRate(item);
    const share = totalRate > 0 ? Math.round((r / totalRate) * 100) : 0;
    const est = Math.round(r * (state.current.duration / 60));
    const rateEl = document.querySelector(`[data-card-rate="${idx}"]`);
    if (rateEl) rateEl.textContent = r;
    const barEl = document.querySelector(`[data-card-sharebar="${idx}"]`);
    if (barEl) barEl.style.width = `${share}%`;
    const shareEl = document.querySelector(`[data-card-share="${idx}"]`);
    if (shareEl) shareEl.textContent = `${share}%`;
    const estEl = document.querySelector(`[data-card-est="${idx}"]`);
    if (estEl) estEl.textContent = `~${fmtCompactNum(est)}`;
    const maxEl = document.querySelector(`[data-card-maxinf="${idx}"]`);
    if (maxEl) maxEl.textContent = item.maxInFlight;
    const lblEl = document.querySelector(`[data-card-label="${idx}"]`);
    if (lblEl) lblEl.textContent = item.label;
    const patEl = document.querySelector(`[data-card-pat="${idx}"]`);
    if (patEl) patEl.textContent = item.pattern === 'bursts' ? `BURST ${item.burstSize}×${item.burstRate}` : 'LINEAR';
  });
  if (e >= 0) {
    const f = fieldOf(k);
    const kvEl = document.querySelector(`[data-card-kv="${e}:${k}"]`);
    if (kvEl) kvEl.textContent = fmtVal(val, f);
  }

  const envPrev = document.querySelector(`[data-envprev="${id}"]`);
  if (envPrev && typeof val === 'string') {
    const res = resolvePlaceholders(val);
    if (res) envPrev.innerHTML = `<span class="faint">→</span> <span class="${res.hasUnknown ? 'warn' : ''}">${esc(res.resolved)}</span> <span class="faint">(${esc(state.env)})</span>`;
  }
}

// =============================================================================
// 9. Event Delegation
// =============================================================================
const root = document.getElementById('root');

root.addEventListener('click', ev => {
  const t = ev.target.closest(
    '[data-set-vp],[data-demo],[data-menu],[data-close-menu],[data-pick-env],' +
    '[data-load-preset],[data-clear-plan],[data-undo-plan],[data-select-target],[data-close-inspector],' +
    '[data-toggle],[data-pattern],[data-open-add],[data-add-sc],' +
    '[data-delete-entry],[data-dup-entry],[data-list-add],[data-list-del],[data-toggle-run],' +
    '[data-view-run],[data-exit-history],[data-inspect-run],[data-load-from-run],[data-close-dlg],[data-shade-close],[data-nav-toast]'
  );
  if (!t) return;
  const ds = t.dataset;

  if ('shadeClose' in ds && ev.target !== t) return;
  if ('closeMenu' in ds) { state.menu = null; render(); return; }
  if ('closeDlg' in ds || 'shadeClose' in ds) { state.dialog = null; render(); return; }
  if (ds.navToast) { showToast(`${ds.navToast} — draft focuses on Plan Editing`); return; }

  if (ds.setVp) { state.viewport = ds.setVp; render(); return; }
  if (ds.demo) {
    state.dialog = null; state.menu = null; state.isRunning = false; state.viewingRunId = null;
    if (ds.demo === 'default') { state.current = clone(PRESETS['Black Friday']); state.openTarget = 0; }
    else if (ds.demo === 'empty') { state.current = { ...clone(PRESETS['Black Friday']), entries: [] }; state.openTarget = null; }
    else if (ds.demo === 'drift') { state.dialog = { type: 'inspect', id: 38 }; }
    else if (ds.demo === 'unknown') { state.dialog = { type: 'inspect', id: 35 }; }
    render();
    return;
  }
  if (ds.menu) { state.menu = state.menu === ds.menu ? null : ds.menu; render(); return; }
  if (ds.pickEnv) { state.env = ds.pickEnv; state.menu = null; showToast(`Environment switched to ${state.env}`); return; }
  if (ds.loadPreset) {
    state.undoPlan = clone(state.current);
    state.current = clone(PRESETS[ds.loadPreset]);
    state.viewingRunId = null;
    state.menu = null;
    state.openTarget = state.current.entries.length ? 0 : null;
    showToast(`Loaded preset “${ds.loadPreset}”`, true);
    return;
  }
  if ('clearPlan' in ds) {
    if (state.current.entries.length === 0) return;
    state.undoPlan = clone(state.current);
    const count = state.current.entries.length;
    state.current.entries = [];
    state.openTarget = null;
    showToast(`Cleared ${count} scenario${count === 1 ? '' : 's'} from plan`, true);
    return;
  }
  if ('undoPlan' in ds) {
    if (state.undoPlan) {
      state.current = state.undoPlan;
      state.undoPlan = null;
      state.toast = null;
      state.openTarget = state.current.entries.length ? 0 : null;
      render();
    }
    return;
  }
  if (ds.selectTarget !== undefined) {
    if (state.viewingRunId) return;
    state.openTarget = +ds.selectTarget;
    render();
    return;
  }
  if ('closeInspector' in ds) { state.openTarget = null; render(); return; }
  if (ds.toggle) {
    const [e, k] = ds.toggle.split(':');
    const cur = +e < 0 ? state.current[k] : state.current.entries[+e].params[k];
    mutateField(+e, k, !cur);
    return;
  }
  if (ds.pattern) {
    const [e, pat] = ds.pattern.split(':');
    mutateField(+e, 'pattern', pat);
    return;
  }
  if ('openAdd' in ds) { state.dialog = { type: 'add' }; render(); return; }
  if (ds.addSc) {
    const sc = CATALOG[ds.addSc];
    state.current.entries.push(makeEntry(ds.addSc, sc.name, 60));
    state.openTarget = state.current.entries.length - 1;
    state.dialog = null;
    showToast(`Added “${sc.name}”`);
    return;
  }
  if (ds.dupEntry !== undefined) {
    const idx = +ds.dupEntry;
    const orig = state.current.entries[idx];
    const copy = clone(orig);
    copy.label = `${orig.label} (copy)`;
    state.current.entries.splice(idx + 1, 0, copy);
    state.openTarget = idx + 1;
    showToast(`Duplicated “${orig.label}”`);
    return;
  }
  if (ds.deleteEntry !== undefined) {
    const idx = +ds.deleteEntry;
    state.undoPlan = clone(state.current);
    const removed = state.current.entries.splice(idx, 1)[0];
    state.openTarget = state.current.entries.length ? Math.min(idx, state.current.entries.length - 1) : null;
    showToast(`Removed “${removed.label}”`, true);
    return;
  }
  if (ds.listAdd) {
    const [e, k] = ds.listAdd.split(':');
    state.current.entries[+e].params[k].push('/api/new-step');
    render();
    return;
  }
  if (ds.listDel) {
    const [e, k, idx] = ds.listDel.split(':');
    state.current.entries[+e].params[k].splice(+idx, 1);
    render();
    return;
  }
  if ('toggleRun' in ds) {
    state.isRunning = !state.isRunning;
    render();
    return;
  }
  if (ds.viewRun) {
    state.viewingRunId = +ds.viewRun;
    state.menu = null;
    render();
    return;
  }
  if ('exitHistory' in ds) {
    state.viewingRunId = null;
    state.menu = null;
    render();
    return;
  }
  if (ds.inspectRun) {
    state.menu = null;
    state.dialog = { type: 'inspect', id: +ds.inspectRun };
    render();
    return;
  }
  if (ds.loadFromRun) {
    const r = RUNS.find(x => x.id === +ds.loadFromRun);
    state.undoPlan = clone(state.current);
    const p = clone(r.plan);
    p.entries = p.entries.filter(en => CATALOG[en.sc]).map(en => {
      const sc = CATALOG[en.sc];
      const cleanParams = {};
      sc.params.forEach(f => { cleanParams[f.k] = (f.k in en.params) ? clone(en.params[f.k]) : clone(f.d); });
      return { ...en, pattern: en.pattern || 'linear', burstSize: en.burstSize || 15, burstRate: en.burstRate || 6, params: cleanParams };
    });
    state.current = p;
    state.viewingRunId = null;
    state.dialog = null;
    state.openTarget = p.entries.length ? 0 : null;
    showToast(`Loaded Run #${r.id} setup into current plan`, true);
  }
});

root.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'preset-filter-in') {
    state.presetFilter = el.value;
    const pos = el.selectionStart;
    render();
    const again = document.getElementById('preset-filter-in');
    if (again) { again.focus(); again.setSelectionRange(pos, pos); }
    return;
  }
  const key = el.dataset.range || el.dataset.num || el.dataset.input;
  if (key) {
    const [e, k] = key.split(':');
    const f = fieldOf(k);
    let v = el.value;
    if (f.t === 'int') { v = parseInt(v, 10); if (isNaN(v)) return; }
    else if (f.t === 'float') { v = Math.round(parseFloat(v) * 100) / 100; if (isNaN(v)) return; }
    mutateField(+e, k, v, true);
    return;
  }
  if (el.dataset.listInput) {
    const [e, k, idx] = el.dataset.listInput.split(':');
    state.current.entries[+e].params[k][+idx] = el.value;
    mutateField(+e, k, state.current.entries[+e].params[k], true);
  }
});

root.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.range || el.dataset.num || el.dataset.input || el.dataset.listInput) {
    render();
  }
});

window.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') {
    if (state.menu) { state.menu = null; render(); }
    else if (state.dialog) { state.dialog = null; render(); }
    else if (state.openTarget !== null) { state.openTarget = null; render(); }
  }
});

render();
</script>
