# Plain OTel Collector in front of APM Server: services send standard OTLP (4317/4318, protobuf or JSON),
# the collector forwards it as protobuf. In a cluster this is also where tail sampling would go.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlp_grpc:
    endpoint: apm-server:8200
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc]
