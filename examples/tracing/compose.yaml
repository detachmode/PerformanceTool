# A dev cluster in miniature: Beesharp loads two traced services, everything sends spans to one OTel collector,
# and the collector forwards them to Jaeger and/or Elastic. Pick the backend(s) in .env, then:
#
#   docker compose up -d --build
#   open http://localhost:5281   → run the "Shop journey" preset, copy a trace ID from /calls
#   open http://localhost:16686  → Jaeger (or http://localhost:5601 for Kibana)
#
# Dev only: Elastic security is off, nothing here is tuned for production.

name: beesharp-tracing

services:
  # ── The OTLP endpoint of the cluster ──────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector:0.166.0
    command: ["--config", "/etc/otelcol/config.yaml"]
    environment:
      TRACE_EXPORTERS: ${TRACE_EXPORTERS:-[otlp_http/jaeger]}
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"                  # OTLP http/protobuf (also for services running on the host)
    restart: unless-stopped

  # ── Beesharp: the root of every trace ─────────────────────────────────────
  beesharp:
    build: ../..                     # this repo; switch to image: ghcr.io/detachmode/beesharp once released
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318   # http/protobuf is Beesharp's default
      Tracing__TraceUrlTemplate: http://localhost:16686/trace/{traceId}
    volumes:
      - beesharp-data:/app/data
      - ./beesharp/shop-journey.cs:/app/scripts/shop-journey.cs:ro
      - ./beesharp/shop-journey.json:/app/presets/shop-journey.json:ro
    ports:
      - "5281:8080"                  # UI and API
    depends_on: [otel-collector, shop-api]
    restart: unless-stopped

  # ── The services under test ───────────────────────────────────────────────
  shop-api:
    build: ./shop-api
    environment:
      OTEL_SERVICE_NAME: shop-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf   # the .NET SDK defaults to gRPC
      PaymentUrl: http://payment-api:8080
    ports:
      - "5290:8080"                  # to try it by hand: curl localhost:5290/products/1
    depends_on: [otel-collector, payment-api]
    restart: unless-stopped

  payment-api:                       # same image, another service name: shows a trace across services
    build: ./shop-api
    environment:
      OTEL_SERVICE_NAME: payment-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf   # the .NET SDK defaults to gRPC
    depends_on: [otel-collector]
    restart: unless-stopped

  # ── Backend 1: Jaeger (profile jaeger) ────────────────────────────────────
  jaeger:
    profiles: [jaeger]
    image: jaegertracing/jaeger:2.23.0
    command: ["--config", "/etc/jaeger/config.yaml"]
    user: root                       # the Badger volume is owned by root
    volumes:
      - ./jaeger/config.yaml:/etc/jaeger/config.yaml:ro
      - jaeger-badger:/badger
    ports:
      - "16686:16686"                # UI and query API (/api/v3/traces/{traceId})
    restart: unless-stopped

  # ── Backend 2: Elastic (profile elastic) ──────────────────────────────────
  elasticsearch:
    profiles: [elastic]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.7
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      # Dev only: keep writing even when the Docker disk is over 90% full (otherwise new traces are refused).
      cluster.routing.allocation.disk.threshold_enabled: "false"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"                  # Elasticsearch API (trace search)
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 10s
      retries: 30
    restart: unless-stopped

  kibana:
    profiles: [elastic]
    image: docker.elastic.co/kibana/kibana:9.5.7
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"                  # Kibana UI (Observability → Applications → Traces)
    depends_on:
      elasticsearch: { condition: service_healthy }
    restart: unless-stopped

  apm-server:
    profiles: [elastic]
    image: docker.elastic.co/apm/apm-server:9.5.7
    command:
      - -e
      - -E
      - apm-server.host=0.0.0.0:8200
      - -E
      - output.elasticsearch.hosts=["http://elasticsearch:9200"]
    depends_on:
      elasticsearch: { condition: service_healthy }
    restart: unless-stopped

volumes:
  beesharp-data:
  jaeger-badger:
  elastic-data:
